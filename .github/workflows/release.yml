name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.14.0
      - run: npm ci
        working-directory: frontend
      - run: wails build -platform windows/amd64 -nopackage
      - name: Package
        shell: pwsh
        run: Compress-Archive -Path build/bin/* -DestinationPath "Open365VPN-${{ github.ref_name }}-windows-amd64.zip"
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: "Open365VPN-${{ github.ref_name }}-windows-amd64.zip"
